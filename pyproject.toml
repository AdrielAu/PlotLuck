[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plotluck"
version = "0.1.0"
description = "Plotluck: scores English postcode districts for the review-based success of a restaurant"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plotluck = ["cuisine_mapping.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
