name: Tests

# pytest on data/sample and the site's Node tests, so a broken bundle
# contract fails the PR before merge. Pages deploys from pages.yml.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      PLOTLUCK_DATA: sample
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Same install as docs/setup.md: CPU-only torch from the extra index.
      - run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[test]"
      - run: pytest

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No install: the tests use only node: built-ins.
      - run: node --test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser test tools
        run: npm install --prefix "$RUNNER_TEMP/plotluck-browser-tools" --no-package-lock --no-audit --no-fund playwright@1.64.1 leaflet@1.9.4 three@0.160.0
      - name: Install Chromium
        run: '"$RUNNER_TEMP/plotluck-browser-tools/node_modules/.bin/playwright" install --with-deps chromium'
      - name: Test the questions screen and profile confirmation in Chromium
        run: node tests/browser/questions-flow.mjs && node tests/browser/profile-flow.mjs && node tests/browser/nn2-recovery.mjs
        env:
          PLOTLUCK_PLAYWRIGHT: file://${{ runner.temp }}/plotluck-browser-tools/node_modules/playwright/index.mjs
